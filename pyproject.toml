[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cislunar"
version = "0.1.0"
description = "Cislunar (CR3BP) orbit design, 2D/3D visualization, intercept and RPOD targeting"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
interactive = ["plotly>=5"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["cislunar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
